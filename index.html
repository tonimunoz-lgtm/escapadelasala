<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fem Empresa</title>
  <meta name="description" content="Simulador d'empresa per jugar a classe: construeix, produeix i ven.">
  <meta name="theme-color" content="#0a3566">
  <meta property="og:title" content="Fem Empresa">
  <meta property="og:description" content="Simulador d'empresa per jugar a classe.">
  <meta property="og:image" content="img/marca/og-imatge.jpg">
  <link rel="icon" href="img/marca/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/marca/favicon-48.png" sizes="48x48">
  <link rel="apple-touch-icon" href="img/marca/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estil.css">
</head>
<body>
  <!-- Pantalla d'entrada -->
  <section id="pantalla-inici" class="pantalla" hidden>
    <h1 class="ocult">Fem Empresa</h1>
    <div class="inici-caixa">
      <p class="inici-text">Crea la teva empresa, produeix i competeix amb la resta de la classe.</p>
      <button id="btn-entrar" class="btn btn-principal btn-gran">Entra amb Google</button>
      <p id="avis-prova" class="avis-prova" hidden>Mode de prova: les dades només es desen en aquest navegador.</p>
    </div>
  </section>

  <!-- Creació de l'empresa -->
  <section id="pantalla-crear" class="pantalla" hidden>
    <form id="form-crear" class="crear-caixa">
      <img src="img/personatges/guia-explica.webp" alt="" class="crear-guia" width="256" height="256">
      <h2>Funda la teva empresa</h2>
      <label class="camp">
        <span>Nom de l'empresa</span>
        <input id="nom-empresa" maxlength="30" required autocomplete="off" placeholder="Per exemple: Pa i Oli SL">
      </label>
      <fieldset class="camp">
        <legend>Tria un logo</legend>
        <div id="graella-logos" class="graella-logos"></div>
      </fieldset>
      <button class="btn btn-principal btn-gran" type="submit">Crea l'empresa</button>
    </form>
  </section>

  <!-- Joc -->
  <section id="pantalla-joc" class="pantalla" hidden>
    <header class="barra">
      <div class="barra-empresa">
        <img id="barra-logo" alt="" width="40" height="40">
        <span id="barra-nom"></span>
      </div>
      <div class="barra-diners" title="Diners">
        <img src="img/recursos/recurs-diners.webp" alt="" width="28" height="28">
        <span id="barra-diners"></span>
      </div>
      <nav class="barra-accions">
        <button id="btn-magatzem" class="btn-barra"><img src="img/recursos/recurs-productes.webp" alt="" width="26" height="26"><span>Magatzem</span></button>
        <button id="btn-classificacio" class="btn-barra"><img src="img/interficie/boto-estadistiques.webp" alt="" width="26" height="26"><span>Classificació</span></button>
        <button id="btn-sortir" class="btn-barra btn-sortir"><span>Sortir</span></button>
      </nav>
    </header>

    <div id="visor" class="visor">
      <div id="mapa" class="mapa"></div>
    </div>

    <div class="zoom">
      <button id="zoom-mes" aria-label="Apropa">+</button>
      <button id="zoom-menys" aria-label="Allunya">−</button>
    </div>

    <aside id="panell" class="panell" hidden aria-live="polite">
      <header class="panell-cap">
        <h2 id="panell-titol"></h2>
        <button id="panell-tancar" class="btn-tancar" aria-label="Tanca">×</button>
      </header>
      <div id="panell-cos" class="panell-cos"></div>
    </aside>

    <div id="guia" class="guia" hidden>
      <img id="guia-img" alt="" width="256" height="256">
      <div class="bafarada">
        <p id="guia-text"></p>
        <button id="guia-seguent" class="btn btn-principal">Següent</button>
      </div>
    </div>
  </section>

  <div id="avisos" class="avisos" aria-live="assertive"></div>
  <div id="carregant" class="carregant"><img src="img/marca/logo.webp" alt="Carregant…" width="356" height="290"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
